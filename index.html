<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lead Source Performance — Superior One Roofing</title>
<style>
:root{--brand:#0176d3;--brand-d:#014486;--bg:#f3f3f3;--line:#dddbda;--ink:#181818;--mute:#5c5c5c;--ok:#2e844a;--bad:#ba0517;--warn:#dd7a01}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;cursor:pointer}
/* global header */
.gh{background:#fff;border-bottom:1px solid var(--line);height:48px;display:flex;align-items:center;gap:14px;padding:0 16px}
.wm{font-weight:700;font-size:15px;color:var(--brand-d);letter-spacing:.01em}
.search{flex:1;max-width:520px;margin:0 auto;border:1px solid var(--line);border-radius:4px;padding:6px 12px;color:var(--mute);background:#f3f3f3}
.av{width:28px;height:28px;border-radius:50%;background:#c9c7c5;display:grid;place-items:center;font-size:11px;font-weight:700;color:#444}
.tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 16px;height:42px;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.tabs .app{font-weight:700;font-size:15px;display:flex;align-items:center;padding-right:18px;margin-right:6px;border-right:1px solid var(--line)}
.tabs a{padding:0 14px;display:flex;align-items:center;color:#2e2e2e;border-bottom:3px solid transparent;cursor:default}
.tabs a.on{border-color:var(--brand);color:var(--brand-d);font-weight:600}
.wrap{padding:12px 16px 40px}
/* page header */
.ph{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.ico{width:42px;height:42px;border-radius:8px;background:#e8f1fb;display:grid;place-items:center;color:var(--brand);font-size:20px;font-weight:700}
.ph small{color:var(--mute);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.ph h1{margin:0;font-size:20px;font-weight:700}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--brand);padding:0 14px;height:30px;border-radius:4px;font-weight:500}
.btn:hover{background:#f3f3f3}
.btn.b{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.b:hover{background:var(--brand-d)}
.grp{display:inline-flex}.grp .btn{border-radius:0;margin-left:-1px}.grp .btn:first-child{border-radius:4px 0 0 4px;margin:0}.grp .btn:last-child{border-radius:0 4px 4px 0}
.grp .btn.on{background:var(--brand);color:#fff;border-color:var(--brand);position:relative}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px;padding:12px 16px;margin-bottom:12px}
.hl small{display:block;color:var(--mute);font-size:11px}.hl b{font-size:18px;font-weight:600}
.hl em{font-style:normal;font-size:11px;margin-left:6px}
.bar2{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:15px;padding:3px 12px 3px 8px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.off{opacity:.45}
.up{color:var(--ok)}.dn{color:var(--bad)}.nu{color:var(--mute)}
/* board */
.board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.col{flex:1 0 245px;min-width:245px;background:#ecebea;border-radius:4px;border:1px solid var(--line)}
.ch{background:#fff;border-top:4px solid var(--c);padding:10px 12px;border-radius:4px 4px 0 0;border-bottom:1px solid var(--line)}
.ch .r{display:flex;align-items:center;gap:8px}
.mark{width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.ch b{font-size:14px}.ch small{color:var(--mute);display:block;font-size:11px}
.hot{margin-left:auto;background:#fce8e6;color:var(--bad);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;cursor:pointer;border:0}
.tiles{padding:8px;display:flex;flex-direction:column;gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 11px;cursor:pointer;position:relative;transition:.12s}
.tile:hover{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.tile .tt{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between}
.tile .tt span{color:var(--brand);font-size:14px;line-height:1}
.tile .tv{font-size:22px;font-weight:600;margin-top:2px}
.tile .tv small{font-size:12px;font-weight:400;color:var(--mute)}
.tile .ts{font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:6px;align-items:flex-end}
.tile svg{display:block;margin-left:auto}
/* drawer */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:20}
#ov.o{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(940px,96vw);background:#fff;z-index:21;transform:translateX(102%);transition:.25s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.25)}
#dr.o{transform:none}
.dh{padding:14px 20px 10px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:18px}.dh small{color:var(--mute);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.x{margin-left:auto;border:0;background:none;font-size:24px;color:var(--mute);line-height:1}
.db{padding:14px 20px 40px;overflow-y:auto;flex:1;background:#fafaf9}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kp>div{background:#fff;border:1px solid var(--line);border-radius:4px;padding:9px 12px}
.kp small{display:block;color:var(--mute);font-size:11px}.kp b{font-size:19px;font-weight:600}.kp em{font-style:normal;font-size:11px;display:block}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--mute);letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafaf9;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid #eee;vertical-align:middle}
td.n,th.n{text-align:right}
tr.cl{cursor:pointer}tr.cl:hover td{background:#f3f9ff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.g2{grid-template-columns:1fr}}
.bw{display:flex;align-items:center;gap:8px;margin:5px 0}
.bw span.l{width:150px;flex:none;font-size:12px}.bw span.v{width:52px;flex:none;text-align:right;font-size:12px;color:var(--mute)}
.bw .t{flex:1;height:10px;background:#eee;border-radius:5px;overflow:hidden}.bw .t i{display:block;height:100%;background:var(--c,var(--brand));border-radius:5px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pt{border:1px solid var(--line);background:#fff;border-radius:15px;padding:3px 12px;cursor:pointer;color:var(--mute)}
.pt.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sw{padding:0 20px;display:flex;gap:6px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sw span{padding:8px 4px;margin-right:12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--mute)}
.sw span.on{color:var(--brand-d);border-color:var(--brand);font-weight:600}
.badge{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;font-weight:600;line-height:18px}
.b-hot{background:#fce8e6;color:var(--bad)}.b-warm{background:#fff0d6;color:#a35c00}.b-cold{background:#e8f1fb;color:var(--brand-d)}.b-ok{background:#e1f5e8;color:var(--ok)}.b-gr{background:#eee;color:#444}
.note{color:var(--mute);font-size:11.5px;margin:6px 0 0}
.info{background:#eef4ff;border:1px solid #c5d9f5;border-radius:4px;padding:8px 12px;margin-bottom:12px;color:#032d60;font-size:12px}
/* funnel */
.fs{margin:6px 0;cursor:pointer}.fs .top{display:flex;justify-content:space-between;font-size:12px}
.fs .tr{height:26px;background:#ecebea;border-radius:3px;overflow:hidden}.fs .tr i{display:block;height:100%;background:var(--c,var(--brand));opacity:.85;transition:.2s}
.fs.sel .tr{outline:2px solid var(--brand)}
.drop{font-size:11px;color:var(--bad);text-align:right;margin-top:-2px}
/* heatmap page */
.hm{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;height:540px;background:#fff;font-size:11px}
.hm .blk{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;color:#999;border-bottom:1px dashed #e5e5e5}
.hm .nv{top:0;height:36px;justify-content:space-between;padding:0 14px;background:#f7f7f7;color:#666}
.hm .hero{top:36px;height:170px;background:linear-gradient(#eaf3fb,#fff);flex-direction:column;gap:8px;color:#444}
.hm .hero h4{margin:0;font-size:18px;color:#222}
.hm .cta{background:#0176d3;color:#fff;border-radius:4px;padding:8px 16px;font-weight:600}
.hm .tr1{top:206px;height:50px}.hm .fm{top:256px;height:130px;background:#fcfcfc}.hm .gl{top:386px;height:90px}.hm .rv{top:476px;height:64px}
.blob{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,0,0,.75),rgba(255,160,0,.45) 45%,rgba(255,255,0,0) 72%);cursor:help}
.sm{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(220,40,40,.55),rgba(240,170,30,.5) 30%,rgba(120,200,90,.45) 55%,rgba(60,120,220,.5) 80%,rgba(40,60,160,.6))}
.smk{position:absolute;left:0;right:0;border-top:1px dashed #333;font-size:11px;color:#111;padding-left:6px;background:rgba(255,255,255,.55)}
/* replay */
.rp{display:grid;grid-template-columns:260px 1fr;gap:12px}
@media(max-width:760px){.rp{grid-template-columns:1fr}}
.sl{border:1px solid var(--line);border-radius:4px;background:#fff;max-height:420px;overflow-y:auto}
.si{padding:8px 10px;border-bottom:1px solid #eee;cursor:pointer}.si:hover{background:#f3f9ff}.si.on{background:#e8f1fb;border-left:3px solid var(--brand)}
.si small{color:var(--mute);display:block}
.pl{border:1px solid var(--line);border-radius:4px;background:#fff}
.url{background:#f3f3f3;border-bottom:1px solid var(--line);padding:6px 10px;font-size:12px;color:#555;display:flex;gap:8px;align-items:center}
.pg{height:96px;margin:10px;border:1px dashed #cdd;border-radius:4px;display:grid;place-items:center;color:#667;text-align:center;padding:8px;background:linear-gradient(#f8fbff,#fff)}
.prog{height:6px;background:#eee;border-radius:3px;margin:0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);width:0}
.ev{margin:10px;max-height:190px;overflow-y:auto}
.ev div{padding:4px 0;border-bottom:1px solid #f1f1f1;display:flex;gap:8px;opacity:.35}.ev div.s{opacity:1}
.ev b{width:38px;color:var(--mute);font-weight:500;flex:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#032d60;color:#fff;padding:10px 18px;border-radius:4px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
#toast.o{opacity:1;transform:translateX(-50%)}

/* ---- soft bubble theme ---- */
:root{--brand:#3b82d9;--brand-d:#2b5fa8;--bg:#eaf3fc;--line:#dbe7f5;--ink:#1f2d3d;--mute:#6b7c93;--ok:#3a9a6a;--bad:#d1566b}
body{background:linear-gradient(#eaf3fc,#f4f9ff 320px);font-size:13.5px}
.gh{background:transparent;border:0;height:56px;padding:0 28px}
.search{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 16px}
.av{background:#d6e6f8;color:var(--brand-d)}
.tabs{background:transparent;border:0;box-shadow:none;height:auto;padding:0 28px 6px;gap:6px}
.tabs .app{border:0;padding-right:10px;margin:0;color:var(--brand-d)}
.tabs a{border:0;border-radius:18px;padding:6px 16px;color:var(--mute)}
.tabs a.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 4px rgba(59,130,217,.15)}
.wrap{padding:8px 28px 48px;max-width:1500px;margin:0 auto}
.ph,.hl{background:#fff;border:0;border-radius:22px;box-shadow:0 2px 12px rgba(59,130,217,.10)}
.ph{padding:16px 22px}
.hl{margin:14px 0 10px;padding:16px 24px;border-radius:22px}
.hl small{font-size:11.5px}.hl b{font-size:20px;font-weight:600}
.ico{border-radius:14px;background:#e3effc;width:44px;height:44px}
.ph h1{font-weight:600;font-size:21px}
.btn{border-radius:18px;height:34px;padding:0 16px;border-color:var(--line);color:var(--brand-d)}
.btn.b{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{background:#eef5fd;border-radius:20px;padding:3px;gap:2px}
.grp .btn{border:0!important;border-radius:16px!important;margin:0!important;background:transparent;height:30px}
.grp .btn.on{background:#fff;color:var(--brand-d);box-shadow:0 1px 4px rgba(59,130,217,.2)}
.bar2{margin:14px 0}
.chip{border-color:transparent;background:#fff;border-radius:18px;padding:5px 14px 5px 10px;box-shadow:0 1px 4px rgba(59,130,217,.10)}
.board{gap:16px;padding:4px 2px 14px}
.col{background:rgba(255,255,255,.6);border:0;border-radius:26px;padding:6px;min-width:260px;flex:1 0 260px}
.ch{background:transparent;border:0;border-radius:0;padding:12px 12px 6px}
.ch b{font-size:15px}
.mark{width:32px;height:32px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.hot{background:#fdeaee;color:var(--bad);font-weight:500;padding:3px 10px;border-radius:12px}
.tiles{padding:6px;gap:10px}
.tile{border:0;border-radius:18px;padding:14px 16px;box-shadow:0 1px 6px rgba(59,130,217,.10);transition:.15s}
.tile:hover{box-shadow:0 4px 16px rgba(59,130,217,.22);transform:translateY(-1px)}
.tile .tt{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--mute)}
.tile .tt span{color:#b3c4da;font-size:16px}
.tile .tv{font-size:26px;font-weight:600;margin:2px 0 2px}
.tile .ts{display:block;font-size:12.5px}
.tile .tx{font-size:12px;color:var(--mute);margin-top:2px}
.tile .tv small{font-size:12px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.note{font-size:12px}
/* drawer */
#ov{background:rgba(31,45,61,.28);backdrop-filter:blur(2px)}
#dr{border-radius:28px 0 0 28px;width:min(900px,96vw);box-shadow:-8px 0 40px rgba(43,95,168,.25)}
.dh{padding:20px 26px 12px;border:0}.dh h2{font-weight:600;font-size:20px}
.db{background:#f2f8fe;padding:18px 26px 48px}
.card{border:0;border-radius:20px;padding:18px 20px;box-shadow:0 1px 6px rgba(59,130,217,.08);margin-bottom:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px}
.kp{gap:12px;margin-bottom:16px}
.kp>div{border:0;border-radius:18px;padding:14px 16px;box-shadow:0 1px 6px rgba(59,130,217,.08)}
.kp b{font-size:22px;font-weight:600}
.pt{border-color:transparent;background:#eef5fd;border-radius:16px;padding:4px 14px}
.pt.on{background:var(--brand);color:#fff}
.sw{border:0;padding:0 26px;gap:4px;background:#fff}
.sw span{border:0;padding:6px 14px;margin:4px 0;border-radius:16px}
.sw span.on{background:#e3effc;color:var(--brand-d)}
th{background:transparent;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #eef3f9;padding:10px 8px}
.bw{margin:9px 0}.bw .t{height:12px;background:#e9f1fb;border-radius:6px}.bw .t i{border-radius:6px}
.badge{border-radius:12px;padding:1px 10px}
.fs .tr{height:30px;background:#e9f1fb;border-radius:15px}.fs .tr i{border-radius:15px}
.hm,.sl,.pl{border:0;border-radius:18px;box-shadow:0 1px 6px rgba(59,130,217,.10)}
.hm{border:1px solid var(--line)}
.si{border-color:#eef3f9}.si.on{border-left:0;background:#e3effc}
.info{background:#e3effc;border:0;border-radius:16px;color:var(--brand-d)}
#toast{border-radius:20px;background:#2b5fa8}

/* ---- crisp / button-like pass ---- */
:root{--ink:#14233a;--mute:#4a5d78;--line:#c9dbf0}
body{color:var(--ink)}
.hl small,.kp small,.ph small{color:#33496a;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.hl b,.kp b{color:var(--ink);font-weight:700}
.hl>div{border-left:2px solid #dbe8f7;padding-left:16px}.hl>div:first-child{border:0;padding-left:0}
.col{background:#dcebfa;box-shadow:inset 0 0 0 1px #c9dbf0}
.ch{background:#fff;border-radius:20px;margin:2px 2px 6px;padding:12px 14px;box-shadow:0 3px 10px rgba(43,95,168,.16);border-top:0;position:relative}
.ch:before{content:"";position:absolute;left:14px;right:14px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--c)}
.ch b{font-size:16px;font-weight:700;color:var(--ink)}
.ch small{color:#4a5d78;font-weight:500}
.tiles{padding:4px 2px 4px;gap:12px}
.tile{background:#fff;border:1.5px solid #c3d8f1;border-radius:18px;padding:14px 16px;
 box-shadow:0 4px 0 #b4cdea,0 8px 14px rgba(43,95,168,.16);margin-bottom:4px;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 6px 0 #9fc0e6,0 12px 20px rgba(43,95,168,.25)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #b4cdea,0 3px 6px rgba(43,95,168,.2)}
.tile .tt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-d);padding-bottom:6px;border-bottom:1px solid #e3eefb;margin-bottom:6px}
.tile .tt span{background:#e3effc;color:var(--brand-d);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700}
.tile .tv{font-size:28px;font-weight:700;color:var(--ink)}
.tile .tv small{font-weight:500;color:#4a5d78}
.tile .ts{font-weight:600;font-size:12.5px;color:#33496a}
.tile .tx{color:#4a5d78}
.up{color:#1f7a4d}.dn{color:#c23b55}
.hot{background:#fbdde3;color:#b02a44;font-weight:700;box-shadow:0 2px 0 #f0b9c4}
.chip{border:1.5px solid #c3d8f1;font-weight:600;box-shadow:0 2px 0 #b4cdea;color:var(--ink)}
.chip.off{box-shadow:none;background:#eef5fd}
.btn{border:1.5px solid #c3d8f1;font-weight:600;box-shadow:0 2px 0 #b4cdea;color:var(--brand-d)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.b{box-shadow:0 2px 0 #2b5fa8}
.grp{box-shadow:inset 0 0 0 1.5px #c3d8f1;background:#e3effc}
.grp .btn{box-shadow:none;border:0!important;font-weight:600}
.grp .btn.on{box-shadow:0 2px 0 #b4cdea,0 0 0 1.5px #c3d8f1}
/* drawer */
.card{border:1.5px solid #d3e3f5;box-shadow:0 3px 0 #c9dbf0,0 6px 12px rgba(43,95,168,.10)}
.card h3{color:var(--brand-d);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.05em;padding-bottom:8px;border-bottom:1px solid #e3eefb}
.kp>div{border:1.5px solid #d3e3f5;box-shadow:0 3px 0 #c9dbf0}
th{color:#33496a;font-weight:700;border-bottom:2px solid #c9dbf0}
td{border-bottom:1px solid #dfeaf7}
.bw span.l{font-weight:500;color:var(--ink)}.bw span.v{color:#33496a;font-weight:600}
.pt{border:1.5px solid #c3d8f1;font-weight:600;color:#33496a;background:#fff;box-shadow:0 2px 0 #b4cdea}
.pt.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 0 #2b5fa8}
.sw span{font-weight:600;color:#33496a}
.sw span.on{background:#dcebfa;color:var(--brand-d);box-shadow:inset 0 0 0 1.5px #b4cdea}
.dh small{color:#33496a;font-weight:600}
.badge{font-weight:700}
.fs{padding:6px 8px;border-radius:16px;border:1.5px solid transparent}
.fs:hover{background:#f0f6fd}.fs.sel{border-color:var(--brand);background:#f0f6fd}

/* ---- color-coded, equal columns, emphasis ---- */
body{background:#f4f6fa}
.board{display:grid;grid-template-columns:repeat(var(--n,5),minmax(250px,1fr));gap:16px;overflow-x:auto;align-items:stretch}
.col{flex:none;min-width:0;width:auto;background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 28%,#fff);display:flex;flex-direction:column}
.ch{box-shadow:0 3px 10px rgba(20,35,58,.14)}
.ch:before{height:6px;border-radius:0 0 6px 6px}
.mark{background:var(--c);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.tiles{flex:1}
.tile{--a:#64748b;display:flex;flex-direction:column;min-height:132px;border:1.5px solid #d6dde8;border-left:7px solid var(--a);box-shadow:0 4px 0 #cdd6e3,0 8px 14px rgba(20,35,58,.12)}

.tile .tt{color:var(--a);border-bottom-color:#edf0f5}
.tile .tt span{background:color-mix(in srgb,var(--a) 14%,#fff);color:var(--a)}
.tile[data-m=spend]{--a:#c2610c}
.tile[data-m=impr]{--a:#64748b}
.tile[data-m=clicks]{--a:#2563eb}
.tile[data-m=behavior]{--a:#7c3aed}
.tile[data-m=dropoff]{--a:#d1344f;background:#fff7f8}
.tile[data-m=dropoff] .tv{color:#b01e38}
.tile[data-m=appts]{--a:#16875a;background:linear-gradient(#e8f8ef,#d9f2e4);border-color:#8fd3ae;border-left-color:#16875a;box-shadow:0 4px 0 #86c9a4,0 10px 18px rgba(22,135,90,.25)}
.tile[data-m=appts] .tv{font-size:36px;color:#0f6b46}
.tile[data-m=appts] .tt{color:#0f6b46;border-bottom-color:#b7e3cb}
.tile[data-m=spend] .tv{color:#9a4a06}
.tile .tx{margin-top:auto;padding-top:4px}
.hl{gap:12px}
.hl>div{border:0;padding:8px 14px;border-radius:14px;background:#f4f6fa}
.hl>div:first-child{padding-left:14px}
.hl>div:nth-child(5){background:#d9f2e4;box-shadow:0 3px 0 #86c9a4}.hl>div:nth-child(5) b{color:#0f6b46;font-size:24px}
.hl>div:nth-child(6){background:#fdebd3;box-shadow:0 3px 0 #f0c48a}.hl>div:nth-child(6) b{color:#9a4a06}
.hl>div:nth-child(7){background:#d9f2e4}.hl>div:nth-child(7) b{color:#0f6b46}
.chip{border-color:color-mix(in srgb,var(--c) 45%,#fff);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 35%,#fff)}
.chip i{width:11px;height:11px}
.ph h1{color:var(--ink)}
.tabs a.on,.sw span.on{background:#fff}
.db{background:#f4f6fa}
.card{border-color:#d6dde8;box-shadow:0 3px 0 #cdd6e3,0 6px 12px rgba(20,35,58,.08)}
.kp>div{border-color:#d6dde8;box-shadow:0 3px 0 #cdd6e3}
.kp>div:first-child{border-left:6px solid var(--brand)}
.card h3{color:var(--ink)}

{id:'g',name:'Google',type:'Search + Local Services',color:'#d93025',mark:'G',base:7800,cpm:380,ctr:.035,p:[.96,.78,.45,.42,.65],apr:.45,budget:8500,launch:0,

];
const S=Object.fromEntries(SRC.map(s=>[s.id,s]));
const prod=s=>s.p.reduce((a,b)=>a*b,1);
/* monthly data */
const DATA={};
SRC.forEach((s,si)=>{DATA[s.id]={};[2025,2026].forEach(y=>{
 const r=rng(si*977+y),n=y==2025?12:11,arr=[];
 for(let m=0;m<n;m++){
  let spend;

  const impr=spend/s.cpm*1000,clicks=impr*s.ctr*(.9+.2*r()),leads=clicks*prod(s)*(.9+.2*r()),appts=leads*s.apr*(.9+.2*r());
  arr.push({spend,impr,clicks,leads,appts});
 }DATA[s.id][y]=arr;});});
const RNG={m:{label:'Nov 2026 (MTD)',a:10,b:10},q:{label:'Last 3 months',a:8,b:10},y:{label:'Year to date',a:0,b:10}};
function agg(id,y,a,b){const o={spend:0,impr:0,clicks:0,leads:0,appts:0};
 for(let m=a;m<=b;m++){const d=DATA[id][y][m];if(!d)continue;const f=(m==10&&b==10||m==10)?PRO:1;for(const k in o)o[k]+=d[k]*f}return o}
const cur=(id)=>agg(id,2026,RNG[ST.r].a,RNG[ST.r].b),prev=(id)=>agg(id,2025,RNG[ST.r].a,RNG[ST.r].b);
function dl(c,p,inv){if(!p)return c?`<span class="nu">New</span>`:'';const d=c/p-1,good=inv?d<0:d>0;return`<span class="${Math.abs(d)<.005?'nu':good?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d*100).toFixed(0)}% YoY</span>`}
function dlN(c,p){if(!p)return c?'New':'—';const d=c/p-1;return(d>0?'+':'')+(d*100).toFixed(0)+'%'}
function funnel(s,a){
 const sub=s.p[4],ps=s.p[3],pv=s.p[2],pe=s.p[1];
 const sb=a.leads,st=sb/sub,vw=st/ps,en=vw/pv;let ld=Math.min(en/pe,a.clicks*.995);
 const v=[a.clicks,ld,Math.min(en,ld*.97),Math.min(vw,en*.97),Math.min(st,vw*.97),sb,a.appts];
 return[['Ad / listing click',v[0]],['Page loaded',v[1]],['Engaged 10s+',v[2]],['Viewed pricing / estimate info',v[3]],['Started form or call',v[4]],['Submitted request',v[5]],['Appointment booked',v[6]]];
}
function worstStep(s,a){const f=funnel(s,a);let w=1,wd=0;for(let i=1;i<f.length-1;i++){const d=1-f[i][1]/f[i-1][1];if(d>wd){wd=d;w=i}}return{i:w,name:f[w][0],d:wd}}

const TPL=[['id','price','ret3','phone','storm'],['id','price','start','aband','gal','ret3'],['id','chat','price','start','fin','rev'],['id','bounce','rev'],['id','phone','ret3','price','start','storm'],['id','gal','rev','fin'],['id','storm','price','ret3','start']];
const LEADS={};SRC.forEach((s,si)=>{const r=rng(si+300);LEADS[s.id]=TPL.map((t,i)=>{
 const sig=t.map(k=>SIG[k]),score=Math.max(0,sig.reduce((x,y)=>x+y[1],0));
 return{name:NAMES[(si*7+i*3)%NAMES.length],score,sig,seen:['12 min ago','1 hr ago','3 hrs ago','Yesterday','2 days ago','4 days ago'][Math.floor(r()*6)],city:['Palm Bay','Melbourne','Viera','West Melbourne','Malabar','Sebastian'][Math.floor(r()*6)]}

const ST={r:'m',hide:new Set(),sid:'fb',metric:'spend',tab:'overview',fs:3,rs:0,mapT:'click',tm:null};

/* charts */
function bars(labels,A,B,ca,cb,fmt,h=170){const W=640,P=26,mx=Math.max(1,...A,...B||[0]),bw=(W-P*2)/labels.length;let o=`<svg viewBox="0 0 ${W} ${h+22}" width="100%">`;
 [0,.5,1].forEach(t=>{const y=h-t*(h-14);o+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${P-4}" y="${y+4}" font-size="9" fill="#888" text-anchor="end">${fmt(mx*t)}</text>`});
 labels.forEach((l,i)=>{const x=P+i*bw,w=B?bw*.36:bw*.6,hA=A[i]/mx*(h-14);
  if(B){const hB=B[i]/mx*(h-14);o+=`<rect x="${x+bw*.08}" y="${h-hB}" width="${w}" height="${hB}" fill="${cb}" rx="1"><title>${l} 2025: ${fmt(B[i])}</title></rect><rect x="${x+bw*.08+w+1}" y="${h-hA}" width="${w}" height="${hA}" fill="${ca}" rx="1"><title>${l} 2026: ${fmt(A[i])}</title></rect>`}
  else o+=`<rect x="${x+bw*.2}" y="${h-hA}" width="${w}" height="${hA}" fill="${ca}" rx="1"><title>${l}: ${fmt(A[i])}</title></rect>`;
  o+=`<text x="${x+bw/2}" y="${h+14}" font-size="9" fill="#666" text-anchor="middle">${l}</text>`});
 return o+'</svg>'}
function line(vals,c,labels,fmt,h=150){const W=640,P=30,mx=Math.max(...vals)*1.1,st=(W-P-8)/(vals.length-1);const pts=vals.map((v,i)=>[P+i*st,h-v/mx*(h-10)]);
 let o=`<svg viewBox="0 0 ${W} ${h+20}" width="100%">`;[0,.5,1].forEach(t=>{const y=h-t*(h-10);o+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="#eee"/><text x="${P-4}" y="${y+4}" font-size="9" fill="#888" text-anchor="end">${fmt(mx*t)}</text>`});
 o+=`<path d="M${pts.map(p=>p.join(',')).join(' L')} L${pts[pts.length-1][0]},${h} L${pts[0][0]},${h}Z" fill="${c}" opacity=".12"/><path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="${c}" stroke-width="2"/>`;
 labels.forEach((l,i)=>{if(l)o+=`<text x="${pts[i][0]}" y="${h+14}" font-size="9" fill="#666" text-anchor="middle">${l}</text>`});return o+'</svg>'}
function spark(vals,c){const w=84,h=22,mx=Math.max(...vals,1),mn=Math.min(...vals),st=w/(vals.length-1);return`<svg width="${w}" height="${h}"><path d="M${vals.map((v,i)=>[i*st,h-2-(v-mn)/(mx-mn||1)*(h-5)].join(',')).join(' L')}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`}

const kp=a=>`<div class="kp">`+a.map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b>${x[2]?`<em>${x[2]}</em>`:''}</div>`).join('')+`</div>`;
/* board */
function drawRange(){q('#rng').innerHTML=Object.keys(RNG).map(k=>`<button class="btn ${ST.r==k?'on':''}" data-r="${k}">${RNG[k].label}</button>`).join('')}
function draw(){
 drawRange();
 q('#chips').innerHTML='<span style="color:var(--mute)">Lead sources:</span>'+SRC.map(s=>`<span class="chip ${ST.hide.has(s.id)?'off':''}" style="--c:${s.color}" data-c="${s.id}"><i></i>${s.name}</span>`).join('');
 const vis=SRC.filter(s=>!ST.hide.has(s.id));let T={spend:0,impr:0,clicks:0,leads:0,appts:0},P={...T};
 vis.forEach(s=>{const c=cur(s.id),p=prev(s.id);for(const k in T){T[k]+=c[k];P[k]+=p[k]}});
 q('#hl').innerHTML=[['Total spend',usd(T.spend),dl(T.spend,P.spend)],['Impressions',num(T.impr),dl(T.impr,P.impr)],['Clicks',num(T.clicks),dl(T.clicks,P.clicks)],['Leads',Math.round(T.leads),dl(T.leads,P.leads)],['Appointments booked',Math.round(T.appts),dl(T.appts,P.appts)],['Blended cost / appt',usd(T.spend/Math.max(T.appts,1)),dl(T.spend/Math.max(T.appts,1),P.spend/Math.max(P.appts,1),true)],['Est. revenue',usd(T.appts*CLOSE*JOB),'']].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b><em>${x[2]}</em></div>`).join('');
